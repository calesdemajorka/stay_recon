<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}StayRecon{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink-navy: #14213B;
      --ink-navy-deep: #0E1729;
      --paper: #F4EFE6;
      --brass: #C89B3C;
      --brass-text: #8A6A1F;
      --slate: #8FA0BE;
      --charcoal: #22262B;
      --font-display: 'Domine', Georgia, serif;
      --font-body: system-ui, sans-serif;
      --radius-sm: 4px;
    }

    /* Shared across every page — the whole app's color/type/button system */
    body { font-family: var(--font-body); max-width: 32rem; margin: 4rem auto; padding: 0 1rem; color: var(--charcoal); }
    h1 { font-family: var(--font-display); color: var(--charcoal); margin-bottom: 0.25rem; }
    p { color: #555; }
    a { color: var(--brass-text); }
    label { display: block; margin-top: 1rem; }
    input { display: block; width: 100%; box-sizing: border-box; padding: 0.4rem; margin-top: 0.25rem; border: 1px solid #ccc; border-radius: var(--radius-sm); font: inherit; }
    input:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
    button { margin-top: 1.5rem; padding: 0.5rem 1rem; background: var(--brass); color: var(--ink-navy-deep); border: none; border-radius: var(--radius-sm); font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: var(--brass-text); color: var(--paper); }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--brass-text); outline-offset: 2px; }
    ul.errorlist { color: #b00020; padding-left: 1.2rem; }

    /* Landing page — "The Manifest": scoped so its richer layout never affects any other template */
    body.landing { max-width: none; margin: 0; padding: 0; background: var(--paper); }
    .landing a { color: inherit; }
    .landing .wrap { max-width: 64rem; margin: 0 auto; padding: 0 1.5rem; }

    .landing header.site-header { background: var(--ink-navy); border-bottom: 1px solid rgba(200, 155, 60, 0.35); }
    .landing header.site-header .wrap { display: flex; align-items: center; justify-content: space-between; padding-top: 1.25rem; padding-bottom: 1.25rem; }
    .landing .brand { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; color: var(--paper); text-decoration: none; }
    .landing nav { display: flex; align-items: center; gap: 1.5rem; }
    .landing nav a { color: var(--slate); font-weight: 600; text-decoration: none; }
    .landing nav a.cta-primary { background: var(--brass); color: var(--ink-navy-deep); padding: 0.5rem 1.1rem; border-radius: var(--radius-sm); }

    .landing .cta-primary { display: inline-block; background: var(--brass); color: var(--ink-navy-deep); padding: 0.75rem 1.75rem; border-radius: var(--radius-sm); text-decoration: none; font-weight: 700; }
    .landing .cta-primary:hover { background: var(--brass-text); color: var(--paper); }
    .landing .cta-secondary { display: inline-block; margin-left: 1.25rem; padding: 0.75rem 0.25rem; color: var(--slate); text-decoration: none; font-weight: 600; }

    .landing section.hero { background: var(--ink-navy); color: var(--paper); padding: 5rem 0; }
    .landing .hero .wrap { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 3.5rem; align-items: center; text-align: left; }
    .landing .hero h1 { font-size: 2.75rem; line-height: 1.12; color: var(--paper); margin-bottom: 1.1rem; }
    .landing .hero p.subhead { font-family: var(--font-body); font-size: 1.15rem; color: var(--slate); max-width: 34rem; margin: 0 0 2rem; }

    /* Hero device: a scattered grid of room tiles settling into order — StayRecon's actual job, visualized */
    .landing .grid-device { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 0.65rem; width: 100%; max-width: 13rem; margin: 0 auto; }
    .landing .grid-device .tile { aspect-ratio: 1; border: 1.5px solid var(--slate); border-radius: 3px; }
    .landing .grid-device .tile.resolved { background: var(--brass); border-color: var(--brass); }
    .landing .grid-device .tile:nth-child(1) { transform: rotate(-9deg) translate(-5px, 4px); animation: settle 0.9s 0.05s ease-out forwards; }
    .landing .grid-device .tile:nth-child(2) { transform: rotate(6deg) translate(3px, -6px); animation: settle 0.9s 0.12s ease-out forwards; }
    .landing .grid-device .tile:nth-child(3) { transform: rotate(-4deg) translate(6px, 2px); animation: settle 0.9s 0.08s ease-out forwards; }
    .landing .grid-device .tile:nth-child(4) { transform: rotate(7deg) translate(-4px, -3px); animation: settle 0.9s 0.18s ease-out forwards; }
    .landing .grid-device .tile:nth-child(5) { transform: rotate(-6deg) translate(2px, 5px); animation: settle 0.9s 0.22s ease-out forwards; }
    .landing .grid-device .tile:nth-child(6) { transform: rotate(5deg) translate(-6px, -2px); animation: settle 0.9s 0.15s ease-out forwards; }
    .landing .grid-device .tile:nth-child(7) { transform: rotate(-7deg) translate(4px, -4px); animation: settle 0.9s 0.28s ease-out forwards; }
    .landing .grid-device .tile:nth-child(8) { transform: rotate(4deg) translate(-3px, 6px); animation: settle 0.9s 0.25s ease-out forwards; }
    .landing .grid-device .tile:nth-child(9) { transform: rotate(-5deg) translate(5px, -5px); animation: settle 0.9s 0.32s ease-out forwards; }
    @keyframes settle { to { transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .landing .grid-device .tile { animation: none !important; transform: none !important; }
    }

    .landing section.problem { background: var(--paper); color: var(--charcoal); padding: 4rem 0; }
    .landing section.problem h2 { font-family: var(--font-display); font-size: 1.6rem; margin-bottom: 1.25rem; }
    .landing section.problem p { color: var(--charcoal); max-width: 42rem; }

    /* CSV → room list comparison: what "reconciliation" actually looks like */
    .landing .csv-compare { display: flex; align-items: center; gap: 1.5rem; margin-top: 2rem; flex-wrap: wrap; }
    .landing .csv-compare .panel { background: #fff; border: 1px solid #ddd3bf; border-radius: var(--radius-sm); padding: 1rem 1.25rem; }
    .landing .csv-compare .panel .label { display: block; font-family: var(--font-display); font-size: 0.85rem; color: var(--brass-text); margin-bottom: 0.5rem; }
    .landing .csv-compare table { border-collapse: collapse; font-size: 0.85rem; }
    .landing .csv-compare th, .landing .csv-compare td { padding: 0.25rem 0.6rem; text-align: left; border-bottom: 1px solid #eee2cc; }
    .landing .csv-compare .arrow { font-family: var(--font-display); font-size: 1.5rem; color: var(--brass-text); }

    .landing section.how-it-works { background: var(--ink-navy-deep); color: var(--paper); padding: 4rem 0; }
    .landing section.how-it-works h2 { font-family: var(--font-display); font-size: 1.6rem; margin-bottom: 2rem; }
    .landing .steps { list-style: none; margin: 0; padding: 0; max-width: 36rem; }
    .landing .steps li { display: flex; gap: 1.25rem; position: relative; padding-bottom: 2.25rem; }
    .landing .steps li:not(:last-child)::after { content: ''; position: absolute; left: 1.1rem; top: 2.5rem; bottom: 0; width: 1px; background: rgba(200, 155, 60, 0.4); }
    .landing .step-num { flex: 0 0 auto; width: 2.25rem; height: 2.25rem; border-radius: 50%; background: var(--brass); color: var(--ink-navy-deep); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; }
    .landing .steps h3 { font-family: var(--font-display); font-size: 1.05rem; margin: 0 0 0.35rem; color: var(--paper); }
    .landing .steps p { color: var(--slate); margin: 0; }

    .landing section.cta-repeat { background: var(--ink-navy); color: var(--paper); padding: 4rem 0; text-align: left; }
    .landing section.cta-repeat h2 { font-family: var(--font-display); font-size: 1.75rem; max-width: 28rem; margin: 0 0 1.5rem; }

    .landing footer.site-footer { background: var(--ink-navy-deep); padding: 2rem 0; }
    .landing footer.site-footer .wrap { display: flex; align-items: center; justify-content: space-between; }
    .landing footer.site-footer .brand { font-size: 1rem; }
    .landing footer.site-footer a { color: var(--slate); text-decoration: none; }

    @media (max-width: 640px) {
      .landing .hero .wrap { grid-template-columns: 1fr; text-align: left; }
      .landing .hero h1 { font-size: 2rem; }
      .landing .grid-device { margin: 0; max-width: 10rem; }
      .landing .csv-compare { flex-direction: column; align-items: flex-start; }
      .landing .csv-compare .arrow { transform: rotate(90deg); }
      .landing nav a.cta-primary { padding: 0.4rem 0.75rem; }
    }
  </style>
</head>
<body{% block body_class %}{% endblock %}>
  {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
