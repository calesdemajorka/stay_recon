{% extends "base.html" %}
{% block title %}Map columns — StayRecon{% endblock %}
{% block content %}
  <h1>Map columns</h1>
  <p>Event: {{ event.name }}</p>
  <p>Tell us which column in your CSV is which.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Continue</button>
  </form>
{% endblock %}
